name: Ruff
on: [ push, pull_request ]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --ignore-path Gui/python/rhapi.py"
          src: "./Gui"

      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --exclude Gui/python/rhapi.py"
          src: "./Gui"

